<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07101e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ITIL 4 Pocket Ops">
<title>ITIL 4 Pocket Ops</title>
<style>
html,body{margin:0;min-height:100%;background:#07101e;color:#f4f8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:28px;text-align:center;box-sizing:border-box}.orb{font-size:56px}.bar{width:min(320px,80vw);height:10px;border-radius:999px;background:#142239;overflow:hidden;margin:22px auto}.fill{height:100%;width:15%;background:#35d3c1;border-radius:inherit;animation:load 1.3s ease-in-out infinite alternate}@keyframes load{to{width:88%}}p{color:#9fb0c7;line-height:1.5}button{border:0;border-radius:14px;padding:14px 18px;background:#35d3c1;color:#05111b;font-weight:800;font-size:16px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<main id="loader"><div><div class="orb">🛡️</div><h1>ITIL 4 Pocket Ops</h1><p>Volledige mobiele game laden…</p><div class="bar"><div class="fill"></div></div><p id="status">Gamegegevens ophalen</p></div></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const parts=[];
  for(let i=0;i<6;i++){
   status.textContent=`Gamegegevens ophalen ${i+1}/6`;
   const r=await fetch(`game${i}.txt?v=4`,{cache:'no-store'});
   if(!r.ok) throw new Error(`game${i}.txt ontbreekt`);
   parts.push((await r.text()).trim());
  }
  status.textContent='Game uitpakken…';
  const b64=parts.join('');
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  if(!window.pako) throw new Error('Uitpakmodule kon niet worden geladen. Ververs de pagina.');
  const html=window.pako.ungzip(bytes,{to:'string'});
  if(!html || !html.toLowerCase().includes('<!doctype html')) throw new Error('Gamebestand kon niet worden gecontroleerd.');
  document.open();document.write(html);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('loader').innerHTML=`<div><div class="orb">⚠️</div><h1>Laden mislukt</h1><p>${String(e.message||e)}</p><button onclick="location.href=location.pathname+'?v='+(Date.now())">Opnieuw proberen</button></div>`;
 }
})();
</script>
</body>
</html>
