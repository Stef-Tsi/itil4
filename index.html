<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07101e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ITIL Pocket Ops">
<title>ITIL 4 Pocket Ops</title>
<style>
html,body{margin:0;background:#07101e;color:#f4f8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}main{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}p{color:#9fb0c7}
</style>
</head>
<body>
<main><div><div style="font-size:52px">🛡️</div><h1>ITIL 4 Pocket Ops</h1><p>Volledige game laden…</p></div></main>
<script>
(async()=>{
  try{
    const names=['game0.txt','game1.txt','game2.txt','game3.txt','game4.txt','game5.txt'];
    const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Mist '+n);return r.text()})));
    const b64=parts.join('').trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('Safari-versie ondersteunt decomprimeren niet');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const full=await new Response(stream).text();
    document.open();document.write(full);document.close();
  }catch(e){
    document.querySelector('main').innerHTML='<div><div style="font-size:52px">⚠️</div><h1>Laden mislukt</h1><p>Ververs de pagina in Safari.<br>'+String(e)+'</p></div>';
  }
})();
</script>
</body>
</html>
