name: Publish calibrated 432-question mock
on:
  push:
    branches: [service-quest-training]
    paths:
      - 'mock-v2-src/**'
      - '.github/workflows/mock-v2-live.yml'
permissions:
  contents: write
concurrency:
  group: mock-v2-live
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Assemble source and build 432-question bank
        run: |
          cat mock-v2-src/build.py.*.part > mock-v2-src/build.py
          cat mock-only/focus-tips.js mock-only/focus.js > mock-v2-src/app.js
          cp mock-only/focus.css mock-v2-src/app.css
          python3 mock-v2-src/build.py
          node --check mock-calibrated-v2/app.js
          python3 - <<'PY'
          import json
          a=json.load(open('mock-calibrated-v2/audit.json'))
          assert a['questionCount']==432, a
          assert a['nonRepeatingFullMockCapacity']>=10, a
          assert a['bloom1MarksPerPaper']==9, a
          assert a['bloom2MarksPerPaper']==31, a
          print(a)
          PY

      - name: Use installed Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$CHROME"
          "$CHROME" --version
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          python3 -m pip install --quiet playwright==1.55.0

      - name: Create mobile regression check
        run: |
          cat > /tmp/test_mock_v2.py <<'PY'
          import json,os,sys
          from playwright.sync_api import sync_playwright, expect
          url=sys.argv[1]
          out=sys.argv[2]
          errors=[]; failed=[]; checks=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=os.environ['CHROMIUM_PATH'])
              ctx=browser.new_context(viewport={'width':430,'height':932},is_mobile=True,has_touch=True,device_scale_factor=1,reduced_motion='reduce')
              page=ctx.new_page(); page.set_default_timeout(20000)
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('response',lambda r:failed.append({'url':r.url,'status':r.status}) if r.status>=400 else None)
              page.goto(url,wait_until='networkidle',timeout=90000)
              if 'External Content Notice' in page.title():
                  page.get_by_role('button',name='Open the page',exact=True).click()
              page.wait_for_function('window.MOCK_DATA && window.MOCK_DATA.questions && window.MOCK_DATA.questions.length===432',timeout=60000)
              meta=page.evaluate('window.MOCK_DATA.meta')
              assert meta['questionCount']==432
              assert meta['nonRepeatingFullMockCapacity']>=10
              assert meta['bloom1MarksPerPaper']==9 and meta['bloom2MarksPerPaper']==31
              checks.append('Loaded 432 unique questions; capacity at least 10 full papers; 9 recall + 31 understanding marks')
              expect(page.get_by_text('One question.',exact=False)).to_be_visible()
              page.get_by_role('button',name='3',exact=True).click()
              page.get_by_role('button',name='Start focus block',exact=True).click()
              expect(page.get_by_text('Question 1 / 3',exact=True)).to_be_visible()
              opts=page.locator('[data-choice]'); assert opts.count()==4
              opts.nth(0).click(); page.get_by_role('button',name='Check answer',exact=True).click()
              expect(page.get_by_text('EXPLANATION · ENGLISH',exact=True)).to_be_visible()
              expect(page.get_by_text('Nederlandse uitleg',exact=True)).to_be_visible()
              expect(page.get_by_text('How to read this type of question',exact=True)).to_be_visible()
              checks.append('Focus mode works with English explanation, expanded reading strategy and Dutch help')
              page.get_by_role('button',name='Pause',exact=True).click()
              page.get_by_text('Full mock · 40 questions / 60 minutes',exact=False).click()
              page.get_by_role('button',name='Start full mock',exact=True).click()
              expect(page.get_by_text('Question 1 / 40',exact=True)).to_be_visible()
              expect(page.locator('#timer')).to_be_visible()
              checks.append('Full mock starts with 40 questions and 60-minute timer')
              assert not page.evaluate('document.documentElement.scrollWidth > innerWidth + 2')
              assert not errors,errors
              assert not failed,failed
              report={'url':url,'engine':'chromium','viewport':'430x932','version':page.evaluate('window.MOCK_DATA.version'),'meta':meta,'checks':checks,'errors':errors,'failedResponses':failed,'passed':True}
              open(out,'w').write(json.dumps(report,indent=2,ensure_ascii=False))
              browser.close()
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY

      - name: Test generated site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/mock-v2-server.log 2>&1 &
          sleep 1
          python3 /tmp/test_mock_v2.py 'http://127.0.0.1:8765/mock-calibrated-v2/index.html' /tmp/local-v2-report.json
          cp /tmp/local-v2-report.json mock-calibrated-v2/local-v2-report.json

      - name: Publish tested site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mock-calibrated-v2
          git commit -m 'Publish calibrated 432-question mock [skip ci]'
          git push origin HEAD:service-quest-training
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact public link
        run: |
          URL="https://raw.githack.com/Stef-Tsi/itil4/${PUBLISHED_SHA}/mock-calibrated-v2/index.html"
          python3 /tmp/test_mock_v2.py "$URL" /tmp/live-v2-report.json
          cp /tmp/live-v2-report.json mock-calibrated-v2/live-v2-report.json
          printf '%s\n' "$URL" > mock-calibrated-v2/VERIFIED-LIVE-URL.txt
          git add mock-calibrated-v2/live-v2-report.json mock-calibrated-v2/VERIFIED-LIVE-URL.txt
          git commit -m 'Record verified live calibrated mock [skip ci]'
          git push origin HEAD:service-quest-training
          echo "VERIFIED_LIVE_URL=$URL"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-v2-browser-tests
          path: |
            /tmp/local-v2-report.json
            /tmp/live-v2-report.json
            mock-calibrated-v2/audit.json
          retention-days: 3
          if-no-files-found: warn
