name: Publish verified contrast edition
on:
  push:
    branches: [service-quest-training]
    paths:
      - 'training-src/**'
      - 'quality-src/**'
      - '.github/workflows/training-live.yml'
permissions:
  contents: write
concurrency:
  group: service-quest-training-live
  cancel-in-progress: true
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Build coherent matching and validate both question pools
        run: |
          python3 training-src/build_live.py
          python3 quality-src/build.py
          node --check training/training.js
          node --check training/_next/static/chunks/game-DXb1F_Z4.js
      - name: Install test browsers
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Start local preview with production asset paths
        run: |
          mkdir -p /tmp/sq-web/Stef-Tsi/itil4/service-quest-training
          ln -s "$GITHUB_WORKSPACE/training" /tmp/sq-web/Stef-Tsi/itil4/service-quest-training/training
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/sq-web >/tmp/sq-server.log 2>&1 &
          sleep 1
      - name: Test coherent families, exam pool, mobile controls and saved progress
        run: |
          TEST_ENGINES=chromium,webkit python3 quality-src/test_quality.py 'http://127.0.0.1:8765/Stef-Tsi/itil4/service-quest-training/training/index.html'
          cp test-results/quality-report.json training/local-quality-test-report.json
      - name: Publish tested uncompressed site on training branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training
          if ! git diff --cached --quiet; then
            git commit -m 'Publish coherent matching and curated contrast questions [skip ci]'
            git push origin HEAD:service-quest-training
          fi
      - name: Verify actual public link on mobile Chromium and WebKit
        run: |
          PUBLISHED_SHA=$(git rev-parse HEAD)
          URL="https://raw.githack.com/Stef-Tsi/itil4/${PUBLISHED_SHA}/training/index.html"
          TEST_ENGINES=chromium,webkit python3 quality-src/test_quality.py "$URL"
          cp test-results/quality-report.json training/live-quality-test-report.json
          git add training/live-quality-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified public contrast edition tests [skip ci]'
            git push origin HEAD:service-quest-training
          fi
          echo "VERIFIED_LIVE_URL=$URL"
      - name: Save reports, screenshots and build diagnostic sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-browser-tests
          path: |
            test-results/
            training/quality-audit.json
            quality-src/build.py
            quality-src/runtime.js
            training/training.js
          retention-days: 3
          if-no-files-found: warn
