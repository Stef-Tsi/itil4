name: Publish verified contrast edition
on:
  push:
    branches: [service-quest-training]
    paths:
      - 'training-src/**'
      - 'quality-src/**'
      - '.github/workflows/training-live.yml'
permissions:
  contents: write
concurrency:
  group: service-quest-training-live
  cancel-in-progress: true
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_IMAGE: mcr.microsoft.com/playwright/python:v1.59.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate one coherent release
        run: |
          python3 training-src/build_live.py
          python3 quality-src/build.py
          node --check training/training.js
          node --check training/_next/static/chunks/game-DXb1F_Z4.js
          python3 quality-src/release.py
          RELEASE=$(python3 -c "import json;print(json.load(open('training/release.json'))['directory'])")
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
      - name: Fetch official preinstalled Chromium and WebKit image
        timeout-minutes: 5
        run: docker pull "$BROWSER_IMAGE"
      - name: Start local preview with release asset paths
        run: |
          mkdir -p /tmp/sq-web/Stef-Tsi/itil4/service-quest-training
          ln -s "$GITHUB_WORKSPACE/$RELEASE" "/tmp/sq-web/Stef-Tsi/itil4/service-quest-training/$RELEASE"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/sq-web >/tmp/sq-server.log 2>&1 &
          sleep 1
      - name: Test families, curated exams, mobile controls and saved progress
        run: |
          URL="http://127.0.0.1:8765/Stef-Tsi/itil4/service-quest-training/$RELEASE/index.html"
          docker run --rm --ipc=host --network host -v "$GITHUB_WORKSPACE:/work" -w /work "$BROWSER_IMAGE" bash -lc 'python3 -m pip install --quiet playwright==1.59.0 && TEST_ENGINES=chromium,webkit python3 quality-src/test_quality.py "$1"' bash "$URL"
          cp test-results/quality-report.json training/local-quality-test-report.json
          cp test-results/quality-report.json "$RELEASE/local-quality-test-report.json"
      - name: Publish all tested assets together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training "$RELEASE"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish cache-isolated coherent contrast edition [skip ci]'
            git push origin HEAD:service-quest-training
          fi
      - name: Verify actual public release on mobile Chromium and WebKit
        run: |
          PUBLISHED_SHA=$(git rev-parse HEAD)
          URL="https://raw.githack.com/Stef-Tsi/itil4/${PUBLISHED_SHA}/${RELEASE}/index.html"
          docker run --rm --ipc=host --network host -v "$GITHUB_WORKSPACE:/work" -w /work "$BROWSER_IMAGE" bash -lc 'python3 -m pip install --quiet playwright==1.59.0 && TEST_ENGINES=chromium,webkit python3 quality-src/test_quality.py "$1"' bash "$URL"
          cp test-results/quality-report.json training/live-quality-test-report.json
          cp test-results/quality-report.json "$RELEASE/live-quality-test-report.json"
          git add training/live-quality-test-report.json "$RELEASE/live-quality-test-report.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified public contrast release tests [skip ci]'
            git push origin HEAD:service-quest-training
          fi
          echo "VERIFIED_LIVE_URL=$URL"
      - name: Save reports, screenshots and diagnostic sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-browser-tests
          path: |
            test-results/
            training/quality-audit.json
            training/release.json
            quality-src/build.py
            quality-src/runtime.js
            training/training.js
          retention-days: 3
          if-no-files-found: warn
