name: Upgrade bilingual ITIL learning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply bilingual learning upgrade
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'const EN_FACTS=' play.html; then
            echo 'Upgrade already applied.'
            exit 0
          fi
          python3 - <<'PY'
          import base64, zlib
          payload = '''[... ELLIPSIZATION ...]'''
          patch = zlib.decompress(base64.b64decode(payload))
          open('upgrade.patch', 'wb').write(patch)
          PY
          git apply upgrade.patch
          rm upgrade.patch
          grep -q 'const EN_FACTS=' play.html
          grep -q 'Exam English Drill' play.html
          grep -q 'Game leren' play.html

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('play.html',encoding='utf-8').read()
          parts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          js='\n'.join(x for x in parts if not x.lstrip().startswith('{'))
          open('/tmp/play.js','w',encoding='utf-8').write(js)
          PY
          node --check /tmp/play.js

      - name: Commit upgraded game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "Add English exam and game learning mode [skip ci]"
            git push
          fi
