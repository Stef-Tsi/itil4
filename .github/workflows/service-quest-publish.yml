name: Fast Service Quest preview publish

on:
  push:
    branches: [preview-service-quest]
    paths:
      - 'service-quest/**'
      - '.github/workflows/service-quest-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build preview copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf service-quest-preview
          cp -a service-quest service-quest-preview
          python3 - <<'PY'
          from pathlib import Path
          old='/itil4/service-quest'
          new='/Stef-Tsi/itil4/preview-service-quest/service-quest-preview'
          root=Path('service-quest-preview')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in {'.html','.js','.css','.json','.rsc','.svg','.txt'}:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              s2=s.replace(old,new)
              if s2 != s:
                  p.write_text(s2,encoding='utf-8')
          PY
          test -s service-quest-preview/index.html
      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-quest-preview
          if ! git diff --cached --quiet; then
            git commit -m "Publish Service Quest preview [skip ci]"
            git push origin HEAD:preview-service-quest
          fi
